[package]
name = "kidy"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "kidy is a library for kinematics and dynamics of multi-body."
documentation = "https://docs.rs/kidy"
homepage = "https://github.com/geshengpsn/kidy"
repository = "https://github.com/geshengpsn/kidy"
readme = "readme.md"
keywords = ["math", "science", "robotics"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# [workspace]
# resolver = "3"
# members = [
#     "crates/model_parser",
# ]

[dependencies]
spatial_alg = { git = "https://github.com/geshengpsn/spatial_alg" }
approx = "0.5.1"
nalgebra = "0.34.1"
petgraph = "0.8.2"
urdf-rs = "0.9.0"
reqwest = { version = "0.12", features = ["blocking"] }
hashbrown = "0.15.5"
rerun = "0.25.1"
obj-rs = "0.7.4"
color-name = "1.1.0"
argmin = "0.10.0"
argmin-math = { version = "0.4", features = ["nalgebra_latest"] }
rand = "0.9.2"

[profile.release]
opt-level = 3

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }

[[bench]]
name = "fk"
harness = false

[features]
default = []
any_ik = []
realman75_6f_aik = ["any_ik"]
